name: release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example app-v4.0.4"
        required: true
      backend_ref:
        description: "Backend branch/tag to build with. Main tries main, then master."
        required: false
        default: "Main"

permissions:
  contents: write

jobs:
  build-windows-updater:
    name: Build Windows installer and updater files
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
      BACKEND_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref || vars.SHINDEN_BACKEND_REF || 'Main' }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Apply release version
        run: node scripts/release_tag.mjs

      - name: Checkout backend API
        shell: pwsh
        run: |
          $repo = "https://github.com/NefilimPL/shinden-pl-api-rs.git"
          $destination = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "shinden-pl-api-rs"
          $requestedRef = if ([string]::IsNullOrWhiteSpace($env:BACKEND_REF)) { "Main" } else { $env:BACKEND_REF }
          $candidates = if ($requestedRef -eq "Main") { @("main", "master") } else { @($requestedRef) }

          foreach ($candidate in $candidates) {
            if (Test-Path $destination) {
              Remove-Item -Recurse -Force $destination
            }

            git clone --depth 1 --branch $candidate --single-branch $repo $destination
            if ($LASTEXITCODE -eq 0) {
              "BACKEND_CHECKOUT_REF=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              break
            }
          }

          if (-not (Test-Path (Join-Path $destination "Cargo.toml"))) {
            throw "Could not checkout backend API from $repo using ref '$requestedRef'."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
          }

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SHINDEN_BUILD_PROJECT_ROOT: ${{ github.workspace }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Shinden Client v__VERSION__"
          releaseBody: "Windows installer and updater manifest generated automatically."
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease || false }}

      - name: Patch updater manifest version for suffixed tags
        if: env.UPDATER_VERSION != env.APP_VERSION
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download $env:RELEASE_TAG --pattern latest.json --clobber
          node scripts/patch_updater_manifest.mjs latest.json "$env:UPDATER_VERSION"
          gh release upload $env:RELEASE_TAG latest.json --clobber
